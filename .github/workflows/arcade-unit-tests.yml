name: Arcade Unit Tests

on:
  pull_request:
    paths:
      - 'app/arcade/**'
      - 'app/api/arcade/**'
      - 'components/arcade/**'
      - 'lib/arcade/**'
      - '__tests__/arcade/**'
      - '.github/workflows/arcade-unit-tests.yml'
  push:
    branches:
      - 'feat/feed-living-experience-20261017'
    paths:
      - 'app/arcade/**'
      - 'app/api/arcade/**'
      - 'components/arcade/**'
      - 'lib/arcade/**'
      - '__tests__/arcade/**'
      - '.github/workflows/arcade-unit-tests.yml'

permissions:
  contents: read

jobs:
  arcade-unit:
    name: Pure gameplay logic (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies without running third-party install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test original arcade game rules
        run: ./node_modules/.bin/vitest run __tests__/arcade/dj-quest-level.test.ts __tests__/arcade/rhythm-chart.test.ts __tests__/arcade/personal-best.test.ts __tests__/arcade/tracks-route.test.ts
