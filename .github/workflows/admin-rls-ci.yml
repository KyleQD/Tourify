name: Admin RLS CI

# REL-101 — ephemeral database + migration apply + RLS matrix.
# Uses a disposable Supabase local stack in CI (not the developer's local DB).

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "lib/testing/rls-persona-matrix.ts"
      - "lib/testing/admin-feature-factory.ts"
      - "lib/testing/admin-feature-scenarios.ts"
      - "__tests__/admin/rls-persona-matrix.test.ts"
      - ".github/workflows/admin-rls-ci.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "lib/testing/**"
      - "__tests__/admin/rls-persona-matrix.test.ts"
      - ".github/workflows/admin-rls-ci.yml"
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  rls-matrix:
    name: Migrations And RLS Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.22.6

      - name: Start ephemeral Supabase
        run: supabase start -x realtime,storage,imgproxy,studio,edge-runtime,logflare,vector,supavisor

      - name: Apply unapplied migrations to fresh ephemeral database
        run: supabase migration up --local

      - name: Export ephemeral direct-client credentials
        run: supabase status -o env >> "$GITHUB_ENV"

      - name: Structural and live direct-client RLS matrix tests
        run: npm run test:rls-matrix

      - name: Export status
        if: always()
        run: supabase status || true
