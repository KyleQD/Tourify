name: World Preview Smoke

# P1-T07 - Validates the user-visible World surfaces against a dev server:
# Discover, /discover/world compatibility routing, the globe API, a pilot
# place page, and the review-console gate.

on:
  push:
    branches: [feature/world-of-music]
  pull_request:
    branches: [feature/world-of-music]
  workflow_dispatch:

concurrency:
  group: world-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview-smoke:
    name: Preview smoke (five surfaces)
    runs-on: ubuntu-latest
    env:
      WORLD_MUSIC_SEED_PREVIEW_ENABLED: "true"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start dev server
        run: |
          npx next dev -p 3311 > /tmp/next-dev.log 2>&1 &
          for i in $(seq 1 60); do
            sleep 2
            curl -s -o /dev/null http://127.0.0.1:3311/api/discover && break || true
          done
      - name: Run preview smoke
        run: node scripts/world/preview-smoke.mjs http://127.0.0.1:3311 | tee /tmp/smoke-out.json
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-preview-smoke
          path: |
            /tmp/smoke-out.json
            /tmp/next-dev.log
          if-no-files-found: ignore
