name: E2E Tests

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full, reviewed Git SHA deployed to isolated staging
        required: true
        type: string

jobs:
  unit-tests:
    name: Unit Tests (Vitest)
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run test:unit

  e2e:
    name: E2E Tests (Playwright)
    if: github.event_name != 'workflow_dispatch'
    needs: unit-tests
    runs-on: ubuntu-latest
    # Wave 32: this was 30m. `npm run build` runs `next build`, and next.config.ts
    # sets `eslint.ignoreDuringBuilds: false` + `typescript.ignoreBuildErrors: false`,
    # so the build performs a FULL-repo ESLint and a FULL `tsc --noEmit` inline.
    # Measured on this SHA in the ci.yml "Lint And Build" job: Lint 48s,
    # Typecheck 68m18s. The webpack compile itself is only 3.0m. A 30m budget can
    # therefore never reach `npm run test:e2e`: the 2026-09-22 run of this job spent
    # 25m31s silent inside "Linting and checking validity of types ..." and was
    # killed by the job cap, with every E2E step reported as `skipped`.
    # Budget now matches measured cost, and each expensive step carries its own cap
    # so a hang is attributed to a named step instead of an ambiguous cancelled job.
    timeout-minutes: 115
    environment: staging
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TEST_ORGANIZER_EMAIL: ${{ secrets.TEST_ORGANIZER_EMAIL }}
      TEST_ORGANIZER_PASS: ${{ secrets.TEST_ORGANIZER_PASS }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # Wave 32: this used a secrets expression that substituted STAGING_URL when
      # present and otherwise fell back to localhost. That fallback let a
      # pull-request run silently retarget its mutating specs at a hosted
      # environment (while `environment: staging` secrets stayed loaded) and hid
      # the real target. PR E2E is pinned to the artifact this job builds; hosted
      # certification is the separate launch-certification job.
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install pinned npm
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Refuse a hosted E2E target (fail closed)
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          set -euo pipefail
          # Fail fast and diagnostically instead of discovering a misconfigured
          # target 30+ minutes later inside a browser timeout.
          if [ -n "${STAGING_URL:-}" ]; then
            echo "::error::E2E Tests (Playwright) refuses hosted target '${STAGING_URL}'. This job builds and serves its own app at http://localhost:3000. Hosted release certification must use the 'Launch Certification (exact staging SHA)' job (workflow_dispatch, release_sha)."
            exit 1
          fi
          echo "E2E target: ${PLAYWRIGHT_BASE_URL} (artifact built by this job)"

      - name: Build app
        # Build is the dominant cost. Cap it explicitly so a slow or hung build
        # fails as "Build app" with a retained log rather than as a cancelled job.
        timeout-minutes: 80
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-app.log
        env:
          # `npm run build` hardcodes NODE_OPTIONS='--max-old-space-size=6144'
          # inline, which overrides any value set here. The previous
          # '--max-old-space-size=4096' step value was therefore dead config;
          # it is removed so the effective heap is visible in one place.
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Start app
        run: npm run start &
        env:
          PORT: 3000

      - name: Wait for app
        # wait-on already caps at 60s; the step cap makes a stuck server
        # attributable to this step.
        timeout-minutes: 5
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run E2E tests
        # playwright.config.ts globalTimeout (20m) is the real bound; this step
        # cap leaves room for report collection before the job cap.
        timeout-minutes: 25
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            build-app.log
          retention-days: 7

  launch-certification:
    name: Launch Certification (exact staging SHA)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    permissions:
      contents: read
    concurrency:
      group: launch-certification-${{ inputs.release_sha }}
      cancel-in-progress: false
    env:
      QA_CERT_FIXTURE_PATH: tests/e2e/launch-certification/fixture.example.json
      QA_CERT_EXPECTED_SHA: ${{ inputs.release_sha }}
      QA_CERT_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_BASE_URL: ${{ secrets.QA_CERT_STAGING_URL }}
      QA_CERT_SUPABASE_URL: ${{ secrets.QA_CERT_SUPABASE_URL }}
      QA_CERT_SUPABASE_ANON_KEY: ${{ secrets.QA_CERT_SUPABASE_ANON_KEY }}
      QA_CERT_STAGING_DEPLOYMENT_ID: ${{ secrets.QA_CERT_STAGING_DEPLOYMENT_ID }}
      QA_CERT_PRODUCTION_DEPLOYMENT_ID: ${{ secrets.QA_CERT_PRODUCTION_DEPLOYMENT_ID }}
      QA_CERT_PRODUCTION_URL: ${{ vars.QA_CERT_PRODUCTION_URL }}
      QA_CERT_PRODUCTION_SUPABASE_URL: ${{ vars.QA_CERT_PRODUCTION_SUPABASE_URL }}
      QA_CERT_STRIPE_SECRET_KEY: ${{ secrets.QA_CERT_STRIPE_SECRET_KEY }}
      QA_CERT_MEMBER_EMAIL: ${{ secrets.QA_CERT_MEMBER_EMAIL }}
      QA_CERT_MEMBER_PASSWORD: ${{ secrets.QA_CERT_MEMBER_PASSWORD }}
      QA_CERT_OPERATOR_EMAIL: ${{ secrets.QA_CERT_OPERATOR_EMAIL }}
      QA_CERT_OPERATOR_PASSWORD: ${{ secrets.QA_CERT_OPERATOR_PASSWORD }}
      QA_CERT_FOREIGN_ORG_PROFILE_ID: ${{ secrets.QA_CERT_FOREIGN_ORG_PROFILE_ID }}
      QA_CERT_STRIPE_WEBHOOK_SECRET_MARKETPLACE: ${{ secrets.QA_CERT_STRIPE_WEBHOOK_SECRET_MARKETPLACE }}
      QA_CERT_MARKETPLACE_LISTING_ID: ${{ secrets.QA_CERT_MARKETPLACE_LISTING_ID }}
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Require an exact main-branch SHA
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'; then
            echo "::error::release_sha must be a full 40-character Git SHA."
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$DISPATCH_REF" = refs/heads/main
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.17.0
      - run: npm ci

      - name: Validate launch fixture contract without secrets
        run: npm run test:e2e:launch:contract

      - run: npx playwright install --with-deps chromium

      - name: Certify exact staging release
        run: npm run test:e2e:launch

      - uses: actions/upload-artifact@v4
        if: always() && !cancelled()
        with:
          name: launch-certification-${{ inputs.release_sha }}
          path: |
            playwright-report/launch-certification/
            test-results/launch-certification/
          if-no-files-found: error
          retention-days: 90
