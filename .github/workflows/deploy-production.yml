# Deploys a *second* Vercel project (e.g. tourify.live) if you split demo vs production.
# If you use ONE Vercel project for both demo.tourify.live and tourify.live, skip this workflow
# (disable it in GitHub → Actions) and only use deploy-demo.yml + add both domains in Vercel.

name: Deploy Production

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

env:
  NODE_VERSION: "20"

jobs:
  deploy:
    name: Deploy production Vercel project
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
        vars.ENABLE_VERCEL_PRODUCTION_DEPLOY == 'true' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main')
    environment: production
    permissions:
      contents: read
    concurrency:
      group: deploy-vercel-production
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Require VERCEL_PROJECT_ID_PRODUCTION
        env:
          VERCEL_PROJECT_ID_PRODUCTION: ${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}
        run: |
          if [ -z "$VERCEL_PROJECT_ID_PRODUCTION" ]; then
            echo "::error::Add repository secret VERCEL_PROJECT_ID_PRODUCTION (Vercel project that serves tourify.live)."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PRODUCTION }}

      - name: Validate smoke test configuration
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          SMOKE_TEST_AUTH_BEARER_TOKEN: ${{ secrets.SMOKE_TEST_AUTH_BEARER_TOKEN }}
        run: |
          if [ -z "$PRODUCTION_BASE_URL" ]; then
            echo "::error::Missing repository variable PRODUCTION_BASE_URL"
            exit 1
          fi
          if [ -z "$SMOKE_TEST_AUTH_BEARER_TOKEN" ]; then
            echo "::error::Missing repository secret SMOKE_TEST_AUTH_BEARER_TOKEN"
            exit 1
          fi

      - name: Post-deploy marketplace smoke
        run: npm run test:marketplace-smoke
        env:
          BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          AUTH_BEARER_TOKEN: ${{ secrets.SMOKE_TEST_AUTH_BEARER_TOKEN }}

      - name: Post-deploy music commerce smoke
        run: npm run test:music-commerce-smoke
        env:
          BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          AUTH_BEARER_TOKEN: ${{ secrets.SMOKE_TEST_AUTH_BEARER_TOKEN }}
