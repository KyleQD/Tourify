name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full reviewed SHA already deployed and certified in isolated staging
        required: true
        type: string
      staging_run_id:
        description: Successful Deploy Staging workflow run ID for this SHA
        required: true
        type: string
      certification_run_id:
        description: Successful exact-SHA Launch Certification workflow run ID
        required: true
        type: string
      staging_deployment_id:
        description: Vercel-generated staging deployment ID from retained evidence
        required: true
        type: string
      migration_evidence:
        description: Reviewed production migration evidence reference
        required: true
        type: string
      approval_reference:
        description: Approved production change reference
        required: true
        type: string

env:
  NODE_VERSION: "24"
  VERCEL_CLI_VERSION: "59.19.1"

jobs:
  deploy:
    name: Promote reviewed SHA to isolated production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    concurrency:
      group: deploy-vercel-production
      cancel-in-progress: false
    steps:
      - name: Checkout exact release SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Require full main-branch SHA and reviewed references
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          CERTIFICATION_RUN_ID: ${{ inputs.certification_run_id }}
          STAGING_DEPLOYMENT_ID: ${{ inputs.staging_deployment_id }}
          MIGRATION_EVIDENCE: ${{ inputs.migration_evidence }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$STAGING_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CERTIFICATION_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$STAGING_DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]
          [[ -n "$MIGRATION_EVIDENCE" && -n "$APPROVAL_REFERENCE" ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$DISPATCH_REF" = refs/heads/main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main

      - name: Require matching successful CI, E2E, security, staging, and certification runs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          CERTIFICATION_RUN_ID: ${{ inputs.certification_run_id }}
        run: |
          set -euo pipefail
          for workflow in ci.yml e2e.yml security-scans.yml; do
            conclusion="$(gh run list --workflow "$workflow" --event push --commit "$RELEASE_SHA" --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
            test "$conclusion" = success || { echo "::error::$workflow is not successful for $RELEASE_SHA"; exit 1; }
          done
          for record in "${STAGING_RUN_ID}:deploy-demo.yml" "${CERTIFICATION_RUN_ID}:e2e.yml"; do
            run_id="${record%%:*}"
            workflow="${record#*:}"
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            echo "$run_json" | jq -e --arg sha "$RELEASE_SHA" --arg path ".github/workflows/$workflow" \
              '.head_sha == $sha and .conclusion == "success" and .event == "workflow_dispatch" and (.path | startswith($path + "@"))' > /dev/null || {
                echo "::error::$workflow run $run_id is not a successful manual run for $RELEASE_SHA"
                exit 1
              }
          done

      - name: Download and verify staging deployment evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          STAGING_DEPLOYMENT_ID: ${{ inputs.staging_deployment_id }}
          VERCEL_STAGING_PROJECT_ID: ${{ vars.VERCEL_STAGING_PROJECT_ID }}
          SUPABASE_STAGING_PROJECT_ID: ${{ vars.SUPABASE_STAGING_PROJECT_ID }}
        run: |
          set -euo pipefail
          gh run download "$STAGING_RUN_ID" --name "staging-deployment-$RELEASE_SHA" --dir "$RUNNER_TEMP/staging-evidence"
          node scripts/ci/verify-promotion-evidence.mjs "$RUNNER_TEMP/staging-evidence/staging-deployment-evidence.json"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install pinned npm
        run: npm install --global npm@11.17.0
      - name: Validate isolated production topology
        env:
          DEPLOYMENT_ENVIRONMENT: production
          DEPLOYMENT_DOMAINS: tourify.live,www.tourify.live
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PRODUCTION_PROJECT_ID }}
          VERCEL_STAGING_PROJECT_ID: ${{ vars.VERCEL_STAGING_PROJECT_ID }}
          VERCEL_PRODUCTION_PROJECT_ID: ${{ vars.VERCEL_PRODUCTION_PROJECT_ID }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PRODUCTION_PROJECT_ID }}
          SUPABASE_STAGING_PROJECT_ID: ${{ vars.SUPABASE_STAGING_PROJECT_ID }}
          SUPABASE_PRODUCTION_PROJECT_ID: ${{ vars.SUPABASE_PRODUCTION_PROJECT_ID }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_PRODUCTION_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
        run: npm run check:deployment-topology

      - name: Install dependencies and pinned Vercel CLI
        run: |
          npm ci
          npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull isolated production settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PRODUCTION_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_PRODUCTION_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PRODUCTION_PROJECT_ID }}

      - name: Build production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PRODUCTION_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_PRODUCTION_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PRODUCTION_PROJECT_ID }}

      - name: Deploy exact prebuilt production artifact
        id: deploy
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PRODUCTION_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_PRODUCTION_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PRODUCTION_PROJECT_ID }}

      - name: Verify deployment and production aliases
        id: verify
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_SUPABASE_URL: ${{ vars.SUPABASE_PRODUCTION_URL }}
          EXPECTED_STRIPE_MODE: live
        run: node scripts/ci/verify-deployed-release.mjs production

      - name: Validate smoke test configuration
        env:
          PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          SMOKE_TEST_AUTH_BEARER_TOKEN: ${{ secrets.SMOKE_TEST_AUTH_BEARER_TOKEN }}
        run: |
          set -euo pipefail
          test "$PRODUCTION_BASE_URL" = https://tourify.live
          test -n "$SMOKE_TEST_AUTH_BEARER_TOKEN"

      - name: Post-deploy marketplace smoke
        run: npm run test:marketplace-smoke
        env:
          BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          AUTH_BEARER_TOKEN: ${{ secrets.SMOKE_TEST_AUTH_BEARER_TOKEN }}

      - name: Post-deploy music commerce smoke
        run: npm run test:music-commerce-smoke
        env:
          BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
          AUTH_BEARER_TOKEN: ${{ secrets.SMOKE_TEST_AUTH_BEARER_TOKEN }}

      - name: Record production deployment evidence
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          DEPLOYMENT_ENVIRONMENT: production
          DEPLOYMENT_ID: ${{ steps.verify.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          MIGRATION_EVIDENCE: ${{ inputs.migration_evidence }}
          RELEASE_APPROVER: ${{ github.actor }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          PROMOTION_SOURCE: staging/${{ inputs.staging_run_id }}/${{ inputs.staging_deployment_id }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PRODUCTION_PROJECT_ID }}
          SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PRODUCTION_PROJECT_ID }}
        run: node scripts/ci/write-deployment-evidence.mjs "$RUNNER_TEMP/production-deployment-evidence.json"

      - name: Retain production deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-deployment-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/production-deployment-evidence.json
          if-no-files-found: error
          retention-days: 90
