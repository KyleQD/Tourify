name: Android Native Release

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: production
        type: choice
        options:
          - preview
          - production
      submit_to_play:
        description: Submit the latest build to Google Play
        required: true
        default: false
        type: boolean

jobs:
  android-release:
    name: Build Android native release
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: android-native-release
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing repository secret EXPO_TOKEN"
            exit 1
          fi

      - name: Require Play service account JSON when submit is enabled
        if: inputs.submit_to_play == true
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing repository secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON for Play submission."
            echo "::notice::Build can still run without submit_to_play."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/mobile/package-lock.json"

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android release
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas build \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --non-interactive \
            --wait

      - name: Submit latest Android build to Play
        if: inputs.submit_to_play == true
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          npx eas submit \
            --platform android \
            --profile "${{ inputs.profile }}" \
            --latest \
            --non-interactive
