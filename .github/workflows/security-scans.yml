name: Security scans

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exception-governance:
    name: Security exception governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exception registry
        run: node scripts/ci/check-security-exceptions.mjs
      - name: Test exception validator
        run: node --test scripts/ci/check-security-exceptions.test.mjs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan tracked content and history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reject newly introduced critical vulnerabilities
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
          show-openssf-scorecard: true

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: tourify-sbom.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Retain SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: tourify-sbom-${{ github.sha }}
          path: tourify-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
