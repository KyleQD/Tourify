shared:
  - path: app/api/admin/logistics/vendor/dashboard/route.ts
    owner: admin-commerce
    reason: Vendor administration belongs to commerce even though this legacy route is nested under logistics.
  - path: components/admin/event-parties-panel.tsx
    owner: admin-tour-planning
    reason: The existing ADMIN-024 work treats this collaboration surface as part of tour planning.
  - path: lib/admin/api-route-registry.ts
    owner: admin-governance
    reason: Stable aggregate registry; segment fragments require a coordinated governance lease.
  - path: __tests__/admin/admin-registry-guard-proof.test.ts
    owner: admin-workforce
    reason: TEMPORARY single-task lease for ADMWORK-001, granted under DOMAIN-041. This is the THIRD holder of this path in two days and the reason is the same each time, namely that a proof harness is part of the change that asserts it, and splitting the change from the figures it moves guarantees either a red intermediate state or a window where the harness asserts something false. Authority is bounded to routesWithoutResourceBoundary (pinned at 48) for exactly the three named ADMWORK-001 routes, all of which currently declare resourceBoundary kind none_recorded in lib/admin/route-registry/workforce.ts, so the expected movement is 48 to 45. legacyRouteLimit is a MONOTONIC CEILING, not an exact pin, so this lease must never be used to lower a ceiling into passing. The holder history is admin-governance (standing), then admin-experience-insights (DOMAIN-040, ADMIN-022, discharged), then admin-workforce (DOMAIN-041, ADMWORK-001). ADMCOM-001 is deliberately NOT granted, because it also moves this figure and must serialize behind this task; it additionally needs a separate decision, since its registry entry lives in lib/admin/route-registry/logistics.ts (admin-logistics) rather than the commerce.ts its record declares. Must be returned to admin-governance when ADMWORK-001 completes.
  - path: __tests__/admin/admin-route-registry-fragments.test.ts
    owner: admin-governance
    reason: Cross-fragment completeness and uniqueness proof maintained by registry governance.
  - path: __tests__/admin/admin-route-capability-matrix.test.ts
    owner: admin-logistics
    reason: TEMPORARY single-task lease for ADMIN-021 under DOMAIN-039, not a segment reassignment. The ADMIN-016 inversion pin in this file asserts the route's current inverted state by reading route source, so fixing app/api/admin/logistics/site-maps/[id]/activity without editing this file in the same change turns the admin suite red; atomicity outranks ownership tidiness. Authority is bounded to the one named site-map activity test block and the shared override must be reverted by admin-governance when ADMIN-021 completes (ADMIN-025 is the natural place). Do not add a second shared override to this file; split it per segment instead.
  - path: app/admin/admin-layout-client.tsx
    owner: admin-experience-insights
    reason: Shared Admin shell integration used by every specialist.
  - path: app/admin/globals.css
    owner: admin-experience-insights
    reason: Shared Admin styling boundary; design-system changes require a handoff.
  - path: docs/engineering/admin-reviews/review.schema.json
    owner: admin
    reason: Shared review contract for both advisory managers.
  - path: docs/engineering/admin-reviews/TEMPLATE.json
    owner: admin
    reason: Shared review template; managers write only within their review-specific directories.
